# Project model and subagent defaults. Start a fresh trusted-project session
# after edits. Keep the primary model_reasoning_effort in user config.toml:
# xhigh is the default there, and the app's manual selector can change it.
# A project effort value would override that saved choice on config reload.
# Explicit runtime or CLI overrides take precedence. Roles pin their own effort.
model = "gpt-6-astra"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "high"
interrupt_message = true
